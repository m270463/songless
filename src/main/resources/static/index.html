    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Songless Unlimited</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class = "cardPrincipal">
            <h1>Songless Unlimited</h1>
            
            
        <div id="historico" class="lista-historico">
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
        </div>


        <div class="controles-player">
            
            <button id="botaoRestart" class = "musicButton"> 
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/></svg>
            </button>



            <button id="botaoTocar" class = "musicButton" > 
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play">
                    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
            </button>
            
            
            <button id="botaoSkip" class = "musicButton">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward-icon lucide-skip-forward">
                <path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>

            </button>
            <audio id="musicPlayer"></audio>
        </div>
        
        <div class="autocomplete-wrapper">
            <input type="text" id="campoResposta" placeholder="Digite o nome da música" autocomplete="off">
            <button id="botaoChute">Adivinhar</button>
            <ul id="sugestoes" class="listaSugestoes"></ul>
        </div>
        
        
        <h2 id = "mensagem"> </h2>
        
        
    </main>
        
        <script>
            const botaoTocar = document.getElementById('botaoTocar');
            const botaoSkip = document.getElementById('botaoSkip');
            const player = document.getElementById('musicPlayer');
            const botaoRestart = document.getElementById('botaoRestart');
            const campoResposta = document.getElementById('campoResposta');
            const listaSugestoes = document.getElementById('sugestoes');
            const botaoChute = document.getElementById('botaoChute');
            const historico = document.getElementById('historico');
            const mensagem = document.getElementById('mensagem');
            const tempos = [0.5, 1.0, 2.0, 4.0, 8.0, 15.0];
            let indiceAtual = 0;
            let temporizador;
            let jogoFinalizado = false;
            let musicaAtual = null;
            let timeoutId = null;   
            let indiceAtivo = 0;
            campoResposta.value = '';

            const svgPausa = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause-icon lucide-pause"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>';
            const svgPlay = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>';
            
            function atualizaSvg(){
                player.paused ? botaoTocar.innerHTML = svgPlay : botaoTocar.innerHTML = svgPausa;
            }



            campoResposta.addEventListener('input', function() {
                clearTimeout(timeoutId);
                const termo = campoResposta.value;
                if (termo.length < 2){
                    listaSugestoes.innerHTML = '';
                    return;
                }

                timeoutId = setTimeout(function() {
                    buscarSugestoes(termo);
                },250);
            });

            async function buscarSugestoes(termo){
                const resp = await fetch(`/api/autocomplete?termo=${termo}`);
                const sugestoes = await resp.json();
                exibirSugestoes(sugestoes);
            }

            function exibirSugestoes(sugestoes){
                listaSugestoes.innerHTML = '';
                sugestoes.forEach(texto => {
                    const elemento = document.createElement('li');
                    elemento.textContent = texto;
                    elemento.addEventListener('click' , function(){
                        selecionar(texto);
                    });
                    elemento.classList.add('elementoSugestao');
                    listaSugestoes.appendChild(elemento);
                })
            }

            function selecionar(texto){
                campoResposta.value = texto;
                gerenciarChute();
                listaSugestoes.innerHTML = '';
            }

            campoResposta.addEventListener('keydown', (e) => {
            const itens = listaSugestoes.querySelectorAll('li');
            if (!itens.length) return;

            if (e.key === 'ArrowDown') {
                indiceAtivo = (indiceAtivo + 1) % itens.length;
            } else if (e.key === 'ArrowUp') {
                indiceAtivo = (indiceAtivo - 1 + itens.length) % itens.length;
            } else if (e.key === 'Enter' && indiceAtivo >= 0) {
                e.preventDefault();
                selecionar(itens[indiceAtivo].textContent);
            }
            });


            document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-wrapper')) {
                listaSugestoes.innerHTML = '';
            }
            });






            function carregarMusica(){
                botaoTocar.disabled = true;
                botaoRestart.disabled = true;
                botaoSkip.disabled = true;
                fetch('/api/musica')
                .then(resposta => resposta.json())
                .then(musica => {
                    musicaAtual = musica;
                    player.src = musica.linkAudio;
                    botaoTocar.disabled = false;
                    botaoRestart.disabled = false;
                    botaoSkip.disabled = false;
                });
            };


            carregarMusica();
            
            function adicionarHistorico(texto,acertou){
                const linha = historico.children[indiceAtual];
                linha.innerText = texto;
                if (texto == 'Skipped'){
                    return;
                }
                linha.classList.add(acertou ? 'acerto' : 'erro');

            }

            function gerenciarChute(){
                const chute = campoResposta.value.trim();
                if (!chute || !musicaAtual){
                    return;
                }

                if (chute.split(' - ')[0].toLowerCase() == musicaAtual.nome.toLowerCase()){
                    adicionarHistorico(campoResposta.value,true);
                    vencerJogo();
                    return;
                }
                mensagem.innerText = 'você errou';
                adicionarHistorico(campoResposta.value,false);
                campoResposta.value = '';
                avancarNivel();
            }

            function avancarNivel(){
                if (indiceAtual < tempos.length - 1){
                    indiceAtual++;
                    // botaoTocar.innerText = '';
                    if (!player.paused){
                        clearTimeout(temporizador)
                        const novoTempo = tempos[indiceAtual] - player.currentTime;
                        temporizador = setTimeout(function() {
                            player.pause();
                            atualizaSvg();
                            player.currentTime = 0;
                            // botaoTocar.innerText = '';
                        }, novoTempo * 1000);

                    }
                    // if (indiceAtual == tempos.length - 1){
                    //     botaoSkip.innerText = 'desistir';
                    // }
                    return;
                }
                perderJogo();
            }
            
            function vencerJogo(){
                clearTimeout(temporizador);
                mensagem.innerText = 'você venceu';
                player.currentTime = 0;
                player.play();
                atualizaSvg();
                desativar();
            }

            function perderJogo(){
                clearTimeout(temporizador);
                player.pause();
                player.currentTime = 0;
                atualizaSvg();
                mensagem.innerText =  `você perdeu, a resposta correta era ${musicaAtual.nome} - ${musicaAtual.artista}`;
                desativar();
            }

            function desativar(){
                jogoFinalizado = true;
                botaoChute.disabled = true;
                botaoSkip.disabled = true;
                campoResposta.disabled = true;

            }
    

            botaoChute.addEventListener('click',function(){
                gerenciarChute();
            });

            campoResposta.addEventListener('keypress', function(e){
                if (e.key == 'Enter'){
                    gerenciarChute();
                }
            });


            botaoTocar.addEventListener('click' ,function()  {
                if (!jogoFinalizado){
                    if (!player.paused){
                        player.pause();
                        atualizaSvg();
                        clearTimeout(temporizador);
                        // botaoTocar.innerText = '';
                        return;
                    }

                    const limiteSegundos = tempos[indiceAtual];
                    
                    if (player.currentTime >= limiteSegundos){
                        player.currentTime = 0;
                    }
                    
                    const tempoRestante = limiteSegundos - player.currentTime;
                    
                    const promessaPlay = player.play();
                    atualizaSvg();
                    if (promessaPlay !== undefined) {
                        promessaPlay.then(() => {
                            temporizador = setTimeout(function() {
                                player.pause();
                                atualizaSvg();
                                player.currentTime = 0;
                                // botaoTocar.innerText = '';
                            }, tempoRestante * 1000);
                        }).catch(() => {
                            // botaoTocar.innerText = '';
                        });
}
                }
                else{
                    if (!player.paused){
                        player.pause();
                        atualizaSvg();
                        return;
                    }
                    player.play()
                    atualizaSvg();
                }
            });
        

            botaoRestart.addEventListener('click' , function() {
                clearTimeout(temporizador)
                player.currentTime = 0;

                if (!player.paused && !jogoFinalizado){
                    const tempoTotal = tempos[indiceAtual]
                    temporizador = setTimeout(function() {
                    player.pause();
                    atualizaSvg();
                    player.currentTime = 0;
                    }, tempoTotal * 1000);
                }
            });
            
            botaoSkip.addEventListener('click', function(){
                adicionarHistorico('Skipped',false);
                avancarNivel();
            
            });

            player.addEventListener('ended', function() {
                atualizaSvg();
            });
            



        </script>



    </body>
    </html>
