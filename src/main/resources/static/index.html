    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Songless Unlimited</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class = "wrapper-modo">
            <button id = "botaoModo" class = "botaoModo">Modo Artista</button>
        </div>




        <main class = "cardPrincipal">
            <h1>Songless Unlimited</h1>
            
            <div id = "opcoes" class = "opcoesJogo">
                <button id = "botaoTodos" class = "botaoOpcao">Todos</button>
                <button id = "botaoMPB" class = "botaoOpcao">MPB</button>
                <button id = "botaoRock" class = "botaoOpcao">Rock</button>
                <button id = "botaoPop" class = "botaoOpcao">Pop</button>

                 <div class="autocomplete-wrapper">
                     <input type = "text" id = "campoArtista" class = "campoArtista" placeholder="Digite o nome do artista" autocomplete="off">
                     <button id = "botaoConfirmar" class = "botaoConfirmar">Confirmar</button>
                     <ul id="sugestoesArtistas" class="listaSugestoesArtista"></ul>
                </div>   
            </div>
            
            <div id = "wrapperConfirmação">
                <text id = "textoConfirmação" class = "textoConfirmação">Teste</text>
            </div>    
            
            <div id="historico" class="lista-historico">
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div>
            <div class="linha-historico"></div> 
        </div>
    
        
        <div class="wrapper-barra">
            
            <div class="marcador">
                <span class="marcador-texto">0.5s</span>
                    <span class="marcador-seta">▼</span>
                </div>
                
                <div class="barra-progresso">
                    <div class="segmento"><div class="preenchimento"></div></div>
                    <div class="segmento"><div class="preenchimento"></div></div>
                    <div class="segmento"><div class="preenchimento"></div></div>
                    <div class="segmento"><div class="preenchimento"></div></div>
                    <div class="segmento"><div class="preenchimento"></div></div>
                    <div class="segmento"><div class="preenchimento"></div></div>
                </div>
        
        </div>

        
        <div class="controles-player">
            
            <button id="botaoRestart" class = "musicButton"> 
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/></svg>
            </button>
            
            
            
            <button id="botaoTocar" class = "musicButton" > 
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play">
                    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
            </button>
            
            
            <button id="botaoSkip" class = "musicButton">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward-icon lucide-skip-forward">
                <path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>
                
            </button>
            <audio id="musicPlayer"></audio>
        </div>
        
        <div class="autocomplete-wrapper">
            <input type="text" id="campoResposta" placeholder="Digite o nome da música" autocomplete="off">
            <button id="botaoChute">Adivinhar</button>
            <ul id="sugestoes" class="listaSugestoes"></ul>
        </div>
        
        
        
        
    </main>
    
            <div id="fimJogo" class="escondido">
                <div class="card">
                    <div id = "result" class="titulo">
                        <h2 id="headerFim">Título</h2>
                    </div>

                    <div class="conteudo"> 
                        <p class="subtitulo">A MÚSICA ERA</p>
                        <a id = "linkNome" target="_blank" rel="noopener noreferrer">
                            <h3 id="modalNomeMusica">Nome - Artista</h3>
                            <span id = "botaoRedirect">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-external-link"><path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" /><path d="M11 13l9 -9" /><path d="M15 4h5v5" /></svg>
                            </span>

                        </a>

                        <div class="container-capa">
                            <a id = "linkCapa" target="_blank" rel="noopener noreferrer">
                                <img id="modalCapaAlbum" src="" alt="Capa do Álbum">
                            </a>
                        </div>
                    </div>

                    <div class="final">
                        <button id="botaoProximo">Next Song</button>
                    </div>
                </div>
            </div>
    <script src="js/estado.js"></script>
    <script src="js/marcador.js"></script>
    <script src="js/autocomplete.js"></script>
    <script src="js/progresso.js"></script>
    <script src="js/musica.js"></script>
    <script src="js/jogo.js"></script>
    <script src="js/controles.js"></script>
    <script src="js/main.js"></script>
    



    </body>
    </html>
