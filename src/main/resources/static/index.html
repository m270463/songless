    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Songless</title>
    </head>
    <body>
        <h1>Songless Unlimited - Advinhe a Música</h1>
        
        
        <div>
            <button id="botaoTocar"> Ouvir </button>
            <button id="botaoRestart"> Recomeçar </button>
            <button id = "botaoSkip"> Pular </button>
            <audio id = "musicPlayer"></audio>
        </div>
        
        <div class="autocomplete-wrapper">
            <input type="text" id="campoResposta" placeholder="Digite o nome da música" autocomplete="off">
            <button id="botaoChute">Adivinhar</button>
            <ul id="sugestoes" class="listaSugestoes"></ul>
        </div>


        <h2 id = "mensagem"> </h2>


        <div id = "historico"> </div>
        
        <script>
            const botaoTocar = document.getElementById('botaoTocar');
            const botaoSkip = document.getElementById('botaoSkip');
            const player = document.getElementById('musicPlayer');
            const botaoRestart = document.getElementById('botaoRestart');
            const campoResposta = document.getElementById('campoResposta');
            const listaSugestoes = document.getElementById('sugestoes');
            const botaoChute = document.getElementById('botaoChute');
            const historico = document.getElementById('historico');
            const mensagem = document.getElementById('mensagem');
            const tempos = [0.5, 1.0, 2.0, 4.0, 8.0, 15.0];
            let indiceAtual = 0;
            let temporizador;
            let jogoFinalizado = false;
            let musicaAtual = null;
            let timeoutId = null;   
            let indiceAtivo = 0;
            campoResposta.value = '';

            campoResposta.addEventListener('input', function() {
                clearTimeout(timeoutId);
                const termo = campoResposta.value;
                if (termo.length < 2){
                    listaSugestoes.innerHTML = '';
                    return;
                }

                timeoutId = setTimeout(function() {
                    buscarSugestoes(termo);
                },250);
            });

            async function buscarSugestoes(termo){
                const resp = await fetch(`/api/autocomplete?termo=${termo}`);
                const sugestoes = await resp.json();
                exibirSugestoes(sugestoes);
            }

            function exibirSugestoes(sugestoes){
                listaSugestoes.innerHTML = '';
                sugestoes.forEach(texto => {
                    const elemento = document.createElement('li');
                    elemento.textContent = texto;
                    elemento.addEventListener('click' , function(){
                        selecionar(texto);
                    });
                    listaSugestoes.appendChild(elemento);
                })
            }

            function selecionar(texto){
                campoResposta.value = texto;
                gerenciarChute();
                listaSugestoes.innerHTML = '';
            }

            campoResposta.addEventListener('keydown', (e) => {
            const itens = listaSugestoes.querySelectorAll('li');
            if (!itens.length) return;

            if (e.key === 'ArrowDown') {
                indiceAtivo = (indiceAtivo + 1) % itens.length;
            } else if (e.key === 'ArrowUp') {
                indiceAtivo = (indiceAtivo - 1 + itens.length) % itens.length;
            } else if (e.key === 'Enter' && indiceAtivo >= 0) {
                e.preventDefault();
                selecionar(itens[indiceAtivo].textContent);
            }
            });


            document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-wrapper')) {
                listaSugestoes.innerHTML = '';
            }
            });






            function carregarMusica(){
                botaoTocar.disabled = true;
                botaoRestart.disabled = true;
                botaoSkip.disabled = true;
                fetch('/api/musica')
                .then(resposta => resposta.json())
                .then(musica => {
                    musicaAtual = musica;
                    player.src = musica.linkAudio;
                    botaoTocar.disabled = false;
                    botaoRestart.disabled = false;
                    botaoSkip.disabled = false;
                });
            };


            carregarMusica();
            
            function adicionarHistorico(texto){
                const item = document.createElement('p');
                item.innerText = texto;
                historico.appendChild(item);
            }

            function gerenciarChute(){
                const chute = campoResposta.value.trim();
                if (!chute || !musicaAtual){
                    return;
                }

                if (chute.split(' - ')[0].toLowerCase() == musicaAtual.nome.toLowerCase()){
                    adicionarHistorico(musicaAtual.nome);
                    vencerJogo();
                    return;
                }
                mensagem.innerText = 'você errou';
                adicionarHistorico(campoResposta.value);
                campoResposta.value = '';
                avancarNivel();
            }

            function avancarNivel(){
                if (indiceAtual < tempos.length - 1){
                    indiceAtual++;
                    botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                    if (!player.paused){
                        clearTimeout(temporizador)
                        const novoTempo = tempos[indiceAtual] - player.currentTime;
                        temporizador = setTimeout(function() {
                            player.pause();
                            player.currentTime = 0;
                            botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                        }, novoTempo * 1000);

                    }
                    if (indiceAtual == tempos.length - 1){
                        botaoSkip.innerText = 'desistir';
                    }
                    return;
                }
                perderJogo();
            }
            
            function vencerJogo(){
                clearTimeout(temporizador);
                mensagem.innerText = 'você venceu';
                player.currentTime = 0;
                player.play();
                botaoTocar.innerText = 'pausar';
                desativar();
            }

            function perderJogo(){
                clearTimeout(temporizador);
                player.pause;
                player.currentTime = 0;
                botaoTocar.innerText = 'ouvir';
                mensagem.innerText =  `você perdeu, a resposta correta era ${musicaAtual.nome} - ${musicaAtual.artista}`;
                desativar();
            }

            function desativar(){
                jogoFinalizado = true;
                botaoChute.disabled = true;
                botaoSkip.disabled = true;
                campoResposta.disabled = true;

            }
    

            botaoChute.addEventListener('click',function(){
                gerenciarChute();
            });

            campoResposta.addEventListener('keypress', function(e){
                if (e.key == 'Enter'){
                    gerenciarChute();
                }
            });


            botaoTocar.addEventListener('click' ,function()  {
                if (!jogoFinalizado){
                    if (!player.paused){
                        player.pause();
                        clearTimeout(temporizador);
                        botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                        return;
                    }

                    botaoTocar.innerText = 'Pausar';
                    const limiteSegundos = tempos[indiceAtual];

                    if (player.currentTime >= limiteSegundos){
                        player.currentTime = 0;
                    }

                    const tempoRestante = limiteSegundos - player.currentTime;

                    const promessaPlay = player.play();
                    if (promessaPlay !== undefined) {
                        promessaPlay.then(() => {
                            temporizador = setTimeout(function() {
                                player.pause();
                                player.currentTime = 0;
                                botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                            }, tempoRestante * 1000);
                        }).catch(() => {
                            botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                        });
}


                    temporizador = setTimeout(function() {
                        player.pause();
                        player.currentTime = 0;
                        botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                    }, tempoRestante * 1000);
                }
                else{
                    if (!player.paused){
                        player.pause();
                        botaoTocar.innerText = 'ouvir';
                        return;
                    }
                    player.play()
                    botaoTocar.innerText = 'pausar';
                }
            });
        

            botaoRestart.addEventListener('click' , function() {
                clearTimeout(temporizador)
                player.currentTime = 0;

                if (!player.paused && !jogoFinalizado){
                    const tempoTotal = tempos[indiceAtual]
                    temporizador = setTimeout(function() {
                        botaoTocar.innerText = `Ouvir (${tempos[indiceAtual]}s)`;
                    }, tempoTotal * 1000);
                }
            });
            
            botaoSkip.addEventListener('click', function(){
                avancarNivel();
                adicionarHistorico('skipped');
            
            });




        </script>



    </body>
    </html>
